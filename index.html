<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор расходомеров теплого пола</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        input { width: 80px; padding: 5px; }
        button { padding: 10px 15px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        .warning { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Калькулятор настройки расходомеров теплого пола</h1>
        
        <div>
            <label>Количество контуров: </label>
            <input type="number" id="loopCount" min="1" value="3">
            <button onclick="generateInputs()">Создать</button>
        </div>

        <div id="inputs"></div>

        <div>
            <label>Δt (°C): </label>
            <input type="number" id="deltaT" min="1" value="5">
            <button onclick="calculate()">Рассчитать</button>
        </div>

        <h2>Результаты</h2>
        <table id="results">
            <thead>
                <tr>
                    <th>Контур</th>
                    <th>Длина (м)</th>
                    <th>Диаметр (мм)</th>
                    <th>Мощность (Вт)</th>
                    <th>Расход (л/мин)</th>
                    <th>Скорость (м/с)</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>

        <h2>График расхода по контурам</h2>
        <canvas id="chart" width="400" height="200"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
